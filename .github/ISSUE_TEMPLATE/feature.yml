name: Feature request
description: Propose a use case or backward-compatible improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem rather than only the desired API.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: layer
    attributes:
      label: Likely layer
      options:
        - Plugin or extension
        - Core client
        - Adapter
        - Documentation
        - Unsure
    validations:
      required: true
