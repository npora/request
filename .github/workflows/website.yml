name: Website

on:
  pull_request:
    branches: [main]
    paths: ['website/**', 'src/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'src/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/website.yml']

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Cloudflare website
    runs-on: ubuntu-24.04
    container:
      # Match the locked Playwright version; browsers and OS dependencies are bundled.
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --ipc=host --init
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Install root development tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated website tools
        run: npm ci --prefix website --ignore-scripts
      - name: Audit website dependencies
        run: npm audit --prefix website --audit-level high
      - name: Compile Pages Functions and dry-run the state Worker
        run: npm --prefix website run check
      - name: Verify interfaces in workerd
        run: pnpm test:website
      - name: Verify bundled browser version
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.65.0', 'Update the pinned Playwright image when upgrading Playwright')"
      - name: Match browser home ownership
        # GitHub mounts a home directory owned by the host runner user.
        # Firefox requires the existing directory to belong to its launch user.
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Verify all scenarios in desktop and mobile browsers
        run: pnpm test:website:browser
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-browser-reports
          path: |
            .artifacts/website/browser-report
            .artifacts/website/browser-results
          include-hidden-files: true
          retention-days: 7
