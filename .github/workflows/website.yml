name: Website

on:
  pull_request:
    branches: [main]
    paths: ['website/**', 'src/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'src/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/website.yml']

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Cloudflare website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - name: Install root development tools
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated website tools
        run: npm ci --prefix website --ignore-scripts
      - name: Audit website dependencies
        run: npm audit --prefix website --audit-level high
      - name: Compile Pages Functions and dry-run the state Worker
        run: npm --prefix website run check
      - name: Verify interfaces in workerd
        run: pnpm test:website
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify all scenarios in desktop and mobile browsers
        run: pnpm test:website:browser
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-browser-reports
          path: |
            .artifacts/website/browser-report
            .artifacts/website/browser-results
          include-hidden-files: true
          retention-days: 7
