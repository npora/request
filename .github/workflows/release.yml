name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm
        run: |
          npm install --global npm@11.16.0 --ignore-scripts
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dependencies
        run: |
          pnpm audit:malware
          pnpm audit:dependencies
          pnpm audit:signatures
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify
        run: |
          pnpm typecheck
          pnpm typecheck:next
          pnpm test:types
          pnpm test:examples
          pnpm benchmark:types
          pnpm test:docs
          pnpm test:complexity
          pnpm test:release-workflow
          pnpm test:coverage
          pnpm build
          pnpm test:package

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          create-github-releases: true

      - name: Verify the newly published package
        if: steps.changesets.outputs.published == 'true'
        run: node test/package/registry-install.mjs
        env:
          EXPECTED_PACKAGE_VERSION: ${{ fromJSON(steps.changesets.outputs['published-packages'])[0].version }}
